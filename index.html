<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
}

/* container responsive */
.video-box {
    width: 100%;
    max-width: 420px; /* ukuran HP enak, di PC tetap rapi */
    margin: 20px;
    position: relative;
}

/* gambar auto menyesuaikan */
.video-box img {
    width: 100%;
    height: auto;
    border-radius: 12px;
    display: block;
}

/* tombol play fake */
.play {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 70px;
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
}
</style>
</head>

<body>

<a href="https://blackhubs-official.github.io/congenial-palm-tree/">
    <div class="video-box">
        <img src="https://cdn.aceimg.com/b474c419b.jpg">
        <div class="play"></div>
    </div>
</a>

</body>
</html>
